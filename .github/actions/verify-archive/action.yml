name: "4FusionLab ZIP integrity"
description: "Read-only validation of versioned release ZIPs, SHA-256 and Fusion manifests"
inputs:
  product:
    description: "Product prefix for archive filenames"
    required: true
  version:
    description: "GitVersion MajorMinorPatch"
    required: true
  archives:
    description: "Newline-separated ZIP paths relative to caller workspace"
    required: true
  manifest:
    description: "Fusion manifest path inside ZIP, if this is a Fusion add-in"
    required: false
    default: ""
  notes:
    description: "Nonempty notes file path; omit for a nonpublishing dry-run"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate release artifacts
      shell: bash
      env:
        RELEASE_PRODUCT: ${{ inputs.product }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_ARCHIVES: ${{ inputs.archives }}
        RELEASE_MANIFEST: ${{ inputs.manifest }}
        RELEASE_NOTES: ${{ inputs.notes }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/verify.py" \
          --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION" \
          --archives "$RELEASE_ARCHIVES" \
          --manifest "$RELEASE_MANIFEST" --notes "$RELEASE_NOTES"
